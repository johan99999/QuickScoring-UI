[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quickscore-ui"
version = "0.1.0"
description = "PyQt6 UI for QuickScore application"
authors = [{name = "Your Name"}]
requires-python = ">=3.10,<3.14"
dependencies = [
    "pyqt6>=6.5.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "ffmpeg-python>=0.2.0",
    "pandas>=2.3.2",
    "pydantic>=2.11.7",
    "pyaudio>=0.2.14",
    "python-docx>=1.2.0",
    "fuzzywuzzy>=0.18.0",
    "pyqt6-webengine>=6.9.0",
    "python-levenshtein>=0.27.1",
]

[project.scripts]
quickscore-ui = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
